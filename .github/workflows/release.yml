name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "OnePlus Clock v1.0.0"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            # OnePlus Clock for Windows — v1.0.0
            
            The iconic OnePlus clock brought natively to Windows desktop.
            
            ### Highlights
            - 🕰️ **Iconic OxygenOS Aesthetic**: Signature red "1" numeral and clean typography.
            - 🪟 **Frameless & Floating**: Sits freely on your wallpaper with multi-monitor position memory.
            - 🔒 **100% Offline & Private**: Zero network calls, zero telemetry, zero weather tracking.
            - ⚡ **Lightweight Core**: Consumes < 15 MB of RAM and 0% CPU.
            - 🖱️ **Always-on-Top & Click-Through**: Right-click the clock to open settings.
            
            ### Assets
            - **Setup Installer (Recommended)**: `onepluswidget_1.0.0_x64-setup.exe`
            - **Windows Installer Package**: `onepluswidget_1.0.0_x64_en-US.msi`
            - **Standalone Binary**: `onepluswidget.exe`
          files: |
            src-tauri/target/release/bundle/nsis/onepluswidget_1.0.0_x64-setup.exe
            src-tauri/target/release/bundle/msi/onepluswidget_1.0.0_x64_en-US.msi
            src-tauri/target/release/onepluswidget.exe
